<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Coach — Monitoring Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --accent: #ff7a59;
      --text: #e6e8ef;
      --muted: #8b90a3;
      --border: #2a2e3c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 22px;
      min-width: 180px;
      flex: 1;
    }
    .stat-card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .stat-card .value { font-size: 28px; font-weight: 600; margin-top: 6px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 15px; margin: 0 0 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
    td.q { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      display: inline-block; background: #3a2018; color: var(--accent);
      border-radius: 4px; padding: 2px 7px; font-size: 11px; margin-right: 4px;
    }
    .score { font-weight: 600; }
    .muted { color: var(--muted); }
    canvas { max-height: 280px; }
  </style>
</head>
<body>
  <h1>AI Career Coach — Monitoring Dashboard</h1>
  <div class="subtitle">Voice pipeline + LLM-as-judge observability · auto-refresh every 10s</div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Total interactions</div>
      <div class="value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg overall score</div>
      <div class="value" id="stat-score">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Avg LLM latency</div>
      <div class="value" id="stat-latency">—</div>
    </div>
  </div>

  <div class="card">
    <h2>Overall score over time</h2>
    <canvas id="scoreChart"></canvas>
  </div>

  <div class="card">
    <h2>Last 10 interactions</h2>
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Question</th>
          <th>Overall</th>
          <th>Flags</th>
          <th>LLM latency</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="muted">Waiting for data…</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/app.js"></script>
</body>
</html>
